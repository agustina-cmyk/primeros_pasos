name: Agent — Notificación Diaria (5pm GMT-2)

on:
  schedule:
    - cron: '0 19 * * 1-5'   # 19:00 UTC = 17:00 GMT-2, lunes a viernes
  workflow_dispatch:           # permite correrlo manualmente

concurrency:
  group: agent-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr agente (notify-only)
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_CLOUD_ID: ${{ secrets.JIRA_CLOUD_ID }}
          JIRA_BOARD_ID: ${{ secrets.JIRA_BOARD_ID }}
          JIRA_JQL: ${{ secrets.JIRA_JQL }}
          JIRA_SECTION_FIELD: ${{ secrets.JIRA_SECTION_FIELD }}
          JIRA_CRITICALITY_FIELD: ${{ secrets.JIRA_CRITICALITY_FIELD }}
          JIRA_ENVIRONMENT_FIELD: ${{ secrets.JIRA_ENVIRONMENT_FIELD }}
          JIRA_TYPE_FIELD: ${{ secrets.JIRA_TYPE_FIELD }}
          ROAM_API_TOKEN: ${{ secrets.ROAM_API_TOKEN }}
          ROAM_CPO_CHANNEL_ID: ${{ secrets.ROAM_CPO_CHANNEL_ID }}
          ROAM_CHANNEL_IDS: ${{ secrets.ROAM_CHANNEL_IDS }}
          LLM_WEBHOOK_URL: ${{ secrets.LLM_WEBHOOK_URL }}
          LLM_WEBHOOK_SECRET: ${{ secrets.LLM_WEBHOOK_SECRET }}
          ROADMAP_APP_URL: ${{ secrets.ROADMAP_APP_URL }}
          ROADMAP_SUPABASE_URL: ${{ secrets.ROADMAP_SUPABASE_URL }}
          ROADMAP_SUPABASE_ANON_KEY: ${{ secrets.ROADMAP_SUPABASE_ANON_KEY }}
          PS_AGENT_EMAIL: ${{ secrets.PS_AGENT_EMAIL }}
          PS_AGENT_PASSWORD: ${{ secrets.PS_AGENT_PASSWORD }}
        run: python src/main.py --notify-only

      - name: Guardar estado del agente
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/agent_state.json
          git diff --cached --quiet || git commit -m "chore: actualizar estado del agente [skip ci]"
          git push
